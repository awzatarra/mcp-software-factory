name: Software Factory Deploy MiniStack

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Isolated emulated registry and local compute target
        required: true
        type: choice
        options: [demo-aws-emulated]
      commit_sha:
        description: Full SHA; rollback must equal previous_sha
        required: true
        type: string
      operation:
        description: Manual operation
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]

permissions:
  contents: read

concurrency:
  group: software-factory-deploy-ministack
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master' && github.repository == 'awzatarra/mcp-software-factory'
    runs-on: self-hosted
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      CD_ENVIRONMENT: ${{ inputs.environment }}
      CD_COMMIT_SHA: ${{ inputs.commit_sha }}
      CD_OPERATION: ${{ inputs.operation }}
      CD_ATTEMPT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      SF_MINISTACK_DEPLOY_HOME: C:\software-factory-deploy-ministack
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require Windows
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Windows runner required.' }
      - name: Checkout controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: deploy-ministack-control
          persist-credentials: false
      - name: Select target
        id: target
        run: |
          python deploy-ministack-control/scripts/deployment/deploy_ministack.py select
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checkout requested SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: deploy-ministack-source
          fetch-depth: 0
          persist-credentials: false
      - name: Deploy and report safely
        run: |
          python deploy-ministack-control/scripts/deployment/deploy_ministack.py run --source deploy-ministack-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
