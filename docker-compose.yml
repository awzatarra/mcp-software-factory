name: mcp-software-factory

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - path: .env.production
        required: false
    environment:
      APP_ENV: production
      WORKSPACE_ROOT: /app/workspace
      DATA_ROOT: /app/data
      LANGGRAPH_CHECKPOINT_DB: /app/data/langgraph-checkpoints.sqlite
      WORKFLOW_EVENT_STORE_PATH: /app/data/workflow-events.sqlite
      WORKFLOW_EVENT_DB: /app/data/langgraph-checkpoints-events.sqlite
      API_CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173}
      USE_LANGGRAPH: "true"
      MCP_NETWORK_MODE: private
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - factory_workspace:/app/workspace
      - factory_data:/app/data
    networks:
      - factory_private
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${BACKEND_BASE_URL:-http://127.0.0.1:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    networks:
      - factory_private
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    init: true
    restart: unless-stopped

networks:
  factory_private:
    name: mcp-software-factory-private
    driver: bridge

volumes:
  factory_workspace:
    name: mcp-software-factory-workspace
  factory_data:
    name: mcp-software-factory-data
